const TRIP_START=new Date(2026,10,9), TRIP_END=new Date(2026,10,21);
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let ticks=store.get("vn-ticks")||{};
function itemsOf(d){const out=[];d.groups.forEach((g,gi)=>g[1].forEach((it,ii)=>out.push(d.id+"-"+gi+"-"+ii)));return out}
function pct(d){const ids=itemsOf(d);if(!ids.length)return 0;return Math.round(ids.filter(i=>ticks[i]).length/ids.length*100)}
function pickInitial(){const saved=store.get("vn-day");if(location.hash){const h=location.hash.slice(1);if(DAYS.some(d=>d.id===h))return h}
 const t=new Date();t.setHours(0,0,0,0);if(t>=TRIP_START&&t<=TRIP_END){return "d"+String(t.getDate()).padStart(2,"0")}
 return saved&&DAYS.some(d=>d.id===saved)?saved:"pre"}
let current=pickInitial();
const strip=document.getElementById("strip"), host=document.getElementById("day");
function renderStrip(){strip.innerHTML="";DAYS.forEach(d=>{const b=document.createElement("button");b.className="day-btn"+(d.id==="pre"?" pre":"");b.type="button";b.setAttribute("aria-pressed",d.id===current);b.setAttribute("aria-label",d.label);
 b.innerHTML=`<span class="dow">${d.dow}</span><span class="dnum">${d.id==="pre"?"List":d.dnum}</span><span class="bar"><i style="width:${pct(d)}%"></i></span>`;
 b.onclick=()=>{current=d.id;store.set("vn-day",current);renderStrip();renderDay();host.scrollIntoView({block:"start",behavior:"smooth"})};strip.appendChild(b)});
 const active=strip.querySelector('[aria-pressed="true"]');if(active)active.scrollIntoView({inline:"center",block:"nearest"})}
function tagHtml(w){const name={S:"Satyam",N:"Neha",Y:"Yuvaan",A:"Family"}[w];return `<span class="tag t-${w}">${name}</span>`}
function renderDay(){const d=DAYS.find(x=>x.id===current);const p=pct(d);
 let h=`<div class="dayhead"><span class="eyebrow">${d.label}</span><h2>${d.title}</h2><div class="meta">${d.meta.map(m=>`<span>${m}</span>`).join("")}</div>
 <div class="progress"><span class="track"><i style="width:${p}%"></i></span><span id="pc">${p}% packed</span></div></div>`;
 if(d.timeline.length){h+=`<div class="timeline">${d.timeline.map(t=>`<span class="tm">${t[0]}</span><div>${t[1]}</div>`).join("")}</div>`}
 if(d.alert.length){h+=`<div class="alert"><strong>Remember today</strong><ul>${d.alert.map(a=>`<li>${a}</li>`).join("")}</ul></div>`}
 d.groups.forEach((g,gi)=>{h+=`<div class="group"><h3>${g[0]}</h3>`;g[1].forEach((it,ii)=>{const id=d.id+"-"+gi+"-"+ii;const on=!!ticks[id];
  h+=`<label class="item${on?" checked":""}" for="${id}"><input type="checkbox" id="${id}" ${on?"checked":""}><span class="txt"><span>${it[0]}</span>${it[2]?`<small>${it[2]}</small>`:""}</span><span class="tags">${tagHtml(it[1])}</span></label>`});h+=`</div>`});
 h+=`<div class="tools" id="tools"><button class="btn warn" type="button" id="reset">Clear ticks for this day</button></div>`;
 host.innerHTML=h;
 host.querySelectorAll('input[type="checkbox"]').forEach(cb=>cb.addEventListener("change",()=>{ticks[cb.id]=cb.checked;if(!cb.checked)delete ticks[cb.id];store.set("vn-ticks",ticks);cb.closest(".item").classList.toggle("checked",cb.checked);updateProgress(d)}));
 document.getElementById("reset").onclick=()=>{const t=document.getElementById("tools");t.innerHTML=`<span class="confirm">Clear all ticks for ${d.label}?</span><button class="btn warn" type="button" id="yes">Clear</button><button class="btn" type="button" id="no">Keep</button>`;
  document.getElementById("yes").onclick=()=>{itemsOf(d).forEach(i=>delete ticks[i]);store.set("vn-ticks",ticks);renderStrip();renderDay()};document.getElementById("no").onclick=renderDay};
}
function updateProgress(d){const p=pct(d);host.querySelector(".progress .track i").style.width=p+"%";document.getElementById("pc").textContent=p+"% packed";
 const btn=[...strip.children][DAYS.indexOf(d)];if(btn)btn.querySelector(".bar i").style.width=p+"%"}
renderStrip();renderDay();
</script>
